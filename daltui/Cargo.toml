[package]
name = "daltui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for the DAL OBC, EXP and PDU subsystems (simulation first)"

[dependencies]
ratatui   = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
serialport = { version = "4.10.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
